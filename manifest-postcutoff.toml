# Post-cutoff tier (contamination control): modules first published after the models'
# training cutoff (2026-06). Same schema as manifest.toml; `subdir` (optional) is the
# project directory inside the repo when the package does not live at the repo root.
# status: candidate | selected | rejected (with reason). Selection made 2026-10-24
# (Amirkian chose the four recommended modules); benchmark-v1 is not changed.
# Commits are the repository HEAD on 2026-10-24; the module file at each commit is
# byte-identical to the released sdist (threeway: identical up to CRLF line endings).

[[project]]
name = "threeway"
repo = "https://github.com/Bhavya-Dhoot/threeway"
commit = "3e557ce206ca3ada981e7c5355cf1cba507867b5"  # 2026-09-09
test_deps = []

[[project.target]]
id = "pc-threeway-core"
category = "logic"
module_file = "src/threeway/core.py"
module_name = "threeway.core"
python_path = ["src"]
human_tests = ["tests/test_core.py"]
status = "selected"

